<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="HLLC Floor Competition">
  <title>HLLC Floor Competition</title>
  <!--
    An original mark built only from this site's own visual language: the
    orange accent bar from the header lockup, plus three standings bars in
    the colours the leaderboard already uses for 1st, 2nd and 3rd.

    No University of Illinois trademark appears here — no Block I, no
    "Illinois" wordmark, no athletics mark. School colours on their own are
    not protectable, so the navy/orange palette carries no risk.
  -->
  <rect width="32" height="32" rx="7" fill="#13294B"/>
  <!-- header accent bar -->
  <rect x="5"  y="6"  width="3" height="20" rx="1.5" fill="#E84A27"/>
  <!-- standings: 1st, 2nd, 3rd -->
  <rect x="11" y="6"  width="16" height="5" rx="1.5" fill="#E84A27"/>
  <rect x="11" y="13.5" width="11.5" height="5" rx="1.5" fill="#FFB347"/>
  <rect x="11" y="21" width="7" height="5" rx="1.5" fill="#A9BBD0"/>
</svg>
